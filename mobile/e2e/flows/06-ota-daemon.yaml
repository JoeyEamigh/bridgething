appId: com.bridgething.gateway
name: pushes a daemon-only release without touching the image
---
- runFlow:
    file: ../common/point-at-fixture.yaml
    env:
      MODE: daemon
- extendedWaitUntil:
    visible: ".*install 99.0.0\\+image.0.1.0.*"
    timeout: 180000
- tapOn: ".*install 99.0.0\\+image.0.1.0.*"
- extendedWaitUntil:
    visible: ".*restarting.*"
    timeout: 180000
- runScript:
    file: ../scripts/ota-reboot.js
    env:
      CONTROL: "http://127.0.0.1:${FIXTURE_PORT}"
      DAEMON: "99.0.0"
- extendedWaitUntil:
    visible: ".*update installed.*"
    timeout: 180000
- assertNotVisible: ".*the update did not finish.*"
