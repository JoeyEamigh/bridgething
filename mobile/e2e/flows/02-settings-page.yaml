appId: com.bridgething.gateway
name: renders a webapp settings page, talks to it over the bridge, and reopens it warm
---
- runFlow: ../common/fresh-start.yaml
- tapOn: ".*Home Assistant.*"
- tapOn: "open Home Assistant settings"
- extendedWaitUntil:
    visible: "(?i).*long-lived access token.*"
    timeout: 180000
- assertVisible: "0 selected"
- assertVisible: "connect"
- tapOn: "Done"
- assertVisible: "open Home Assistant settings"
- assertNotVisible: "(?i).*long-lived access token.*"
- tapOn: "open Home Assistant settings"
- extendedWaitUntil:
    visible: "(?i).*long-lived access token.*"
    timeout: 3000
- assertVisible: "0 selected"
- tapOn: "Done"
- assertVisible: "open Home Assistant settings"
