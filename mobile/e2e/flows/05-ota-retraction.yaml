appId: com.bridgething.gateway
name: drops a stale update offer once the device reconnects and turns out to be current
---
- runScript:
      file: ../scripts/ota-bounce-root.js
      env:
          CONTROL: "http://127.0.0.1:${FIXTURE_PORT}"
          MODE: image
- runFlow:
      file: ../common/point-at-fixture.yaml
      env:
          MODE: bounce
- extendedWaitUntil:
      visible: ".*install [0-9.]+\\+image.99.9.9.*"
      timeout: 180000
- runScript:
      file: ../scripts/ota-bounce.js
      env:
          CONTROL: "http://127.0.0.1:${FIXTURE_PORT}"
          MODE: current
          DOWN_MS: "10000"
- extendedWaitUntil:
      visible: ".*dev gateway, connected.*"
      timeout: 180000
- extendedWaitUntil:
      notVisible: ".*install [0-9.]+\\+image\\..*"
      timeout: 60000
- assertNotVisible: ".*install [0-9.]+\\+image.99.9.9.*"
