appId: com.bridgething.gateway
name: survives the link dropping under a run in flight
---
- runFlow:
      file: ../common/point-at-fixture.yaml
      env:
          MODE: image
- extendedWaitUntil:
      visible: ".*99.9.9 available.*"
      timeout: 30000
- tapOn: ".*install 0.10.0\\+image.99.9.9.*"
- runScript:
      file: ../scripts/ota-bounce.js
      env:
          CONTROL: "http://127.0.0.1:${FIXTURE_PORT}"
          MODE: image
          DOWN_MS: "10000"
- extendedWaitUntil:
      visible: ".*dev gateway.*"
      timeout: 60000
- assertVisible: ".*dev gateway.*"
- assertVisible: ".*firmware.*"
