appId: com.bridgething.gateway
name: offers a builtin webapp bump on a device whose image and daemon are current
---
- runFlow:
    file: ../common/point-at-fixture.yaml
    env:
      MODE: webapp
- extendedWaitUntil:
    visible: ".*install [0-9.]+\\+image.0.1.0.*"
    timeout: 180000
- assertVisible: ".*install [0-9.]+\\+image.0.1.0.*"
