appId: com.bridgething.gateway
name: the warm settings page hides and returns with tab switches and the swipe-back gesture
tags:
  - ios-only
---
- runFlow: ../common/fresh-start.yaml
- runFlow:
    file: ../common/open-app.yaml
    env:
      APP: Weather
- tapOn: "open Weather settings"
- extendedWaitUntil:
    visible: "(?i).*location as lat,lon.*"
    timeout: 60000

- tapOn:
    id: "tab-store"
- assertNotVisible: "(?i).*location as lat,lon.*"
- tapOn:
    id: "tab-apps"
- extendedWaitUntil:
    visible: "(?i).*location as lat,lon.*"
    timeout: 3000

- swipe:
    start: 1%, 50%
    end: 90%, 50%
    duration: 400
- extendedWaitUntil:
    visible: "open Weather settings"
    timeout: 5000
- assertNotVisible: "(?i).*location as lat,lon.*"

- tapOn: "open Weather settings"
- extendedWaitUntil:
    visible: "(?i).*location as lat,lon.*"
    timeout: 3000
- tapOn: "Back|Navigate up"
- assertVisible: "open Weather settings"
- assertNotVisible: "(?i).*location as lat,lon.*"
