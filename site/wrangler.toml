name = "bridgething-www"
account_id = "0a665ba1f35a38354b3f623be13f14bd"
compatibility_date = "2026-05-07"
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/apps", "/apps/*", "/oauth/callback"]

[[d1_databases]]
binding = "DB"
database_name = "bridgething-www"
database_id = "916d56e2-3231-492e-b223-72ca9fda4de0"
migrations_dir = "migrations"

[triggers]
crons = ["*/10 * * * *"]

[[routes]]
pattern = "bridgething.com"
custom_domain = true

[[routes]]
pattern = "www.bridgething.com"
custom_domain = true

[observability]
enabled = true
