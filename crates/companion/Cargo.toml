[package]
name = "bridgething-companion"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
async-trait.workspace = true
bridgething-delivery = { path = "../delivery/core" }
bridgething-gateway.workspace = true
bridgething-io = { path = "../io" }
bridgething-sdk-runtime = { path = "../sdk-runtime" }
bytes = "1.11.1"
futures.workspace = true
libbridgething = { path = "../lib" }
md-5 = "0.11.0"
nlu = { path = "../nlu" }
opus = "0.3.1"
regex = "1.12.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
spotify = { path = "../spotify" }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "sync",
  "time",
  "macros",
  "net",
  "io-util",
] }
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { version = "12.0.1", features = ["uuid-impl", "no-serde-warnings"] }
uniffi = { version = "0.32.0", features = ["cli", "tokio"] }
url = "2.5.8"
uuid = { workspace = true, features = ["v7"] }

[features]
default = ["native-io"]
native-io = ["bridgething-io/native-io", "spotify/native-io"]

[dev-dependencies]
base64 = "0.22.1"
bridgething-test-harness = { path = "../test-harness", default-features = false }
futures = { workspace = true }
librespot-protocol = "0.8.0"
protobuf = "3.7.2"
rmp-serde.workspace = true
rmpv = "1.3.1"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true, features = ["codec"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
