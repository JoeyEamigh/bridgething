[package]
name = "bridgething-delivery"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.23.1"
bridgething-gateway.workspace = true
bridgething-io = { path = "../../io" }
bridgething-sdk-runtime = { path = "../../sdk-runtime" }
bytes = "1.11.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures.workspace = true
hex = "0.4.3"
libbridgething = { path = "../../lib" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = []
native-ws = ["bridgething-gateway/native-ws"]
test-support = ["dep:tokio-util"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = [
  "rt",
  "macros",
  "time",
  "test-util",
  "rt-multi-thread",
  "io-util",
  "sync",
] }
tokio-util = { workspace = true, features = ["codec"] }
tracing-subscriber.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "std",
] }
mdns-sd = "0.20.3"
tokio = { workspace = true, features = [
  "sync",
  "net",
  "io-util",
  "rt",
  "time",
  "macros",
] }
tokio-util = { workspace = true, features = ["codec"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
