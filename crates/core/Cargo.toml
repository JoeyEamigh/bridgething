[package]
name = "bridgething"
default-run = "bridgething"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[dependencies]
libbridgething = { path = "../lib" }

# workspace dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7", "serde", "fast-rng"] }
serde_with = { workspace = true, features = ["json"] }
derive_more = { workspace = true, features = ["debug", "from"] }
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
flate2 = { workspace = true }
rmp = { workspace = true }
rmp-serde = { workspace = true }

# systemd feature
sd-notify = { version = "0.5.0", optional = true, features = ["fdstore"] }

# als feature

# mic feature
alsa = { version = "0.12.1", optional = true }
bridgething-dsp = { workspace = true, optional = true }
bridgething-wakeword = { workspace = true, optional = true }
opus = { version = "0.3.1", optional = true }

# chrome feature
headless_chrome = { version = "1.0.21", optional = true }

# swupdate feature
bridgething-swupdate-sys = { workspace = true, optional = true }


# dependencies
tokio-tungstenite = "0.29.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.6.8", features = ["fs"] }
dirs = "6.0.0"
dashmap = { version = "6.1.0", features = ["serde"] }
base64 = "0.22.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tower = { version = "0.5.3", features = ["util"] }
bridgething-iap2 = { workspace = true }
bridgething-mfi = { workspace = true }
anyhow = "1.0.102"
sea-orm = { version = "1.1.20", default-features = false, features = [
  "sqlx-sqlite",
  "runtime-tokio",
  "macros",
  "with-uuid",
] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = [
  "sqlx-sqlite",
  "runtime-tokio",
  "with-uuid",
] }
bytes = "1.11.1"
lru = "0.18.0"
sha2 = "0.11.0"
hex = "0.4.3"
zbus = { version = "5.15.0", default-features = false, features = [
  "tokio",
], optional = true }
evdev = { version = "0.13.2", features = ["tokio"], optional = true }
libc = "0.2.186"
async-stream = "0.3"
tracing-appender = "0.2.5"
zstd = "0.13.3"
memmap2 = "0.9.11"
bridgething-delivery = { path = "../delivery/core" }
bridgething-sdk-runtime = { path = "../sdk-runtime" }
bridgething-io = { path = "../io", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { workspace = true, features = ["bluetoothd", "l2cap", "rfcomm"] }

[features]
default = ["dev-linux-host"]
als = []
mic = [
  "dep:alsa",
  "dep:bridgething-dsp",
  "dep:bridgething-wakeword",
  "dep:opus",
]
input = ["dep:evdev"]
chrome = ["dep:headless_chrome"]
systemd = ["dep:sd-notify", "dep:zbus"]
swupdate = ["dep:bridgething-swupdate-sys"]
superbird = ["als", "systemd", "chrome", "swupdate", "input", "mic"]
# dev features
dev-linux-host = ["als", "systemd", "chrome"]
no-persist = []
# test features
test-tap = []

[[example]]
name = "cover_art"
path = "./examples/cover_art.rs"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
