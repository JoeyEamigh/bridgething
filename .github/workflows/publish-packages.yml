name: publish-packages

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/lib/**"
      - "packages/browser/**"
      - "crates/delivery/wasm/**"
      - "crates/delivery/napi/**"
      - "packages/updater/**"
      - "packages/client-ts/**"
      - "packages/extension-ts/**"
      - "packages/create-bridgething/**"
      - "scripts/publish-packages.ts"
      - ".github/workflows/publish-packages.yml"
      - ".github/workflows/publish-core-node.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve versions and pack without publishing"
        type: boolean
        default: true

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  core-node:
    uses: ./.github/workflows/publish-core-node.yml
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit

  publish:
    needs: core-node
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/sccache
        with:
          key: packages-wasm
      - uses: jetli/wasm-pack-action@v0.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      - name: publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: bun scripts/publish-packages.ts

      - name: publish
        if: github.event_name == 'push' || !inputs.dry_run
        run: bun scripts/publish-packages.ts --publish
