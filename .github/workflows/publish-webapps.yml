name: publish-webapps

on:
  push:
    branches: [main]
    paths:
      - "packages/webapps/catalog/**"
      - "scripts/webapp-zip.ts"
      - ".github/workflows/publish-webapps.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-upload even if the version already exists in R2"
        type: boolean
        default: false

concurrency:
  group: publish-webapps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: bridgething-apps
      PUBLIC_BASE: https://apps.bridgething.com
      PURGE_URLS: /tmp/purge-urls.txt
      CATALOG_DIR: packages/webapps/catalog

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: install rclone (R2 client)
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          region = auto
          no_check_bucket = true
          EOF

      - run: bun install --frozen-lockfile

      - name: build + upload changed webapps
        id: publish
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          published='[]'

          exists() { [ -n "$(rclone lsf "r2:${R2_BUCKET}/$1" 2>/dev/null)" ]; }

          for dir in ${CATALOG_DIR}/*/; do
            slug=$(basename "$dir")
            [ -f "$dir/public/manifest.json" ] || { echo "$slug: no manifest, skipping"; continue; }

            echo "::group::$slug"
            bunx turbo run build --filter="@bridgething/webapp-$slug"

            meta=$(bun run scripts/webapp-zip.ts --dist "$dir/dist" --output "/tmp/$slug.zip")
            id=$(jq -r '.id' <<<"$meta")
            version=$(jq -r '.version' <<<"$meta")

            key="r/${id}/${version}.zip"
            if [[ "$FORCE" != "true" ]] && exists "$key"; then
              echo "$slug $version already published; skipping"
              echo "::endgroup::"
              continue
            fi

            scripts/r2-put "/tmp/$slug.zip" "$key" application/zip

            iconUrl=null
            iconPath=$(jq -r '.iconPath // empty' <<<"$meta")
            iconName=$(jq -r '.icon // empty' <<<"$meta")
            if [[ -n "$iconPath" && -n "$iconName" ]]; then
              ext="${iconName##*.}"
              case "$ext" in
                svg) ctype="image/svg+xml" ;;
                png) ctype="image/png" ;;
                jpg|jpeg) ctype="image/jpeg" ;;
                webp) ctype="image/webp" ;;
                *) ctype="application/octet-stream" ;;
              esac
              scripts/r2-put "$iconPath" "icons/${id}.${ext}" "$ctype"
              iconUrl="\"${PUBLIC_BASE}/icons/${id}.${ext}\""
            fi

            entry=$(jq -c \
              --arg slug "$slug" \
              --arg url "${PUBLIC_BASE}/${key}" \
              --argjson icon "$iconUrl" \
              '{slug: $slug, id, name, description, version, permissions, role, provides_overlay, extension,
                icon: $icon,
                download: {url: $url, size, sha256}}' <<<"$meta")
            published=$(jq -c ". + [$entry]" <<<"$published")
            echo "::endgroup::"
          done

          count=$(jq 'length' <<<"$published")
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "$published" >/tmp/published.json
          echo "published $count webapp(s)"

      - name: purge the cloudflare edge
        if: always()
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
        run: scripts/cf-purge

      - name: tell the publish-apps workflow to regenerate the catalog
        if: steps.publish.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '{event_type: "webapps-published", client_payload: {apps: .}}' /tmp/published.json \
            | gh api repos/JoeyEamigh/bridgething/dispatches --input -
