name: pr

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.rust.outputs.crates }}
      rust: ${{ steps.rust.outputs.any }}
      ts: ${{ steps.filter.outputs.ts }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      swift: ${{ steps.filter.outputs.swift }}
      windows: ${{ steps.filter.outputs.windows }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: work out which crates the diff can reach
        id: rust
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            crates=$(python3 scripts/ci-affected-crates.py)
          else
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            crates=$(python3 scripts/ci-affected-crates.py "origin/${{ github.base_ref }}")
          fi
          echo "crates=${crates}" >>"$GITHUB_OUTPUT"
          echo "any=$([[ -n "$crates" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "reaches: ${crates:-nothing}"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.ref || github.base_ref }}
          filters: |
            shared: &shared
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.github/workflows/pr.yml'
            ts:
              - *shared
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
            kotlin:
              - *shared
              - 'packages/companion/kotlin/**'
              - 'crates/companion/**'
              - '*.gradle.kts'
              - 'gradle/**'
            swift:
              - *shared
              - 'packages/companion/swift/**'
              - 'crates/companion/**'
              - 'Package.swift'
            windows:
              - *shared
              - 'desktop/**'
              - 'crates/companion/**'
              - 'crates/delivery/**'
            desktop:
              - *shared
              - 'desktop/**'
              - 'crates/**'
            mobile:
              - *shared
              - 'mobile/**'
              - 'crates/**'
              - 'packages/**'
              - 'scripts/e2e-mobile.sh'

  rust:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/rust-host

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - run: bun install --frozen-lockfile

      - name: run the affected crates
        env:
          BRIDGETHING_NLU_GRAMMAR_OPTIONAL: "1"
        run: cargo nextest run --locked --no-fail-fast ${{ needs.scope.outputs.crates }}

  rust-shipping:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/rust-host

      - run: just test-shipping

  desktop:
    needs: scope
    if: needs.scope.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/rust-host

      - name: tauri bundling deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: cargo build -p bridgething --features test-tap
      - run: just test-desktop

  windows:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: just check-windows
      - run: cargo clippy -p bridgething-desktop --all-targets -- -D warnings

  swift:
    needs: scope
    if: needs.scope.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: extractions/setup-just@v3
      - run: just test-swift

  kotlin:
    needs: scope
    if: needs.scope.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: extractions/setup-just@v3
      - run: just test-kotlin

  ts:
    needs: scope
    if: needs.scope.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: bun install --frozen-lockfile
      - env:
          TURBO_SCM_BASE: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
        run: bunx turbo run typecheck test --affected

  e2e-android:
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/rust-host

      - name: hand the emulator kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: install cargo-ndk, maestro and the pinned ndk
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >>"$GITHUB_PATH"
          ndk=$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' mobile/android/build.gradle)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" </dev/null >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >>"$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: e2e-gradle-${{ hashFiles('**/*.gradle*', 'gradle/**') }}
          restore-keys: e2e-gradle-

      - run: bun install --frozen-lockfile

      - name: build the app before the emulator exists
        env:
          BRIDGETHING_E2E_ABI: x86_64
          E2E_BUILD_ONLY: "1"
        run: bash scripts/e2e-mobile.sh android

      - uses: reactivecircus/android-emulator-runner@v2
        env:
          BRIDGETHING_E2E_ABI: x86_64
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: just e2e-android

      - name: keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android
          path: |
            .e2e/dev-daemon.log
            .e2e/emulator.log
            ~/.maestro/tests
          if-no-files-found: ignore

  e2e-ios:
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: extractions/setup-just@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >>"$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/.cocoapods
            .e2e/ios-derived
          key: e2e-ios-${{ hashFiles('mobile/ios/Podfile.lock', 'bun.lock') }}
          restore-keys: e2e-ios-

      - run: bun install --frozen-lockfile

      - name: pick a simulator this runner actually has
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available \
            | awk '/^-- iOS/ { ios = 1; next } /^--/ { ios = 0 } ios && /iPhone/ { sub(/ \(.*/, ""); sub(/^ +/, ""); last = $0 } END { print last }')
          [ -n "$name" ] || { echo "no available iphone simulator" >&2; exit 1; }
          echo "BRIDGETHING_E2E_SIM=$name" >>"$GITHUB_ENV"

      - run: just e2e-ios

      - name: keep the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios
          path: |
            .e2e/dev-daemon.log
            ~/.maestro/tests
          if-no-files-found: ignore

  gate:
    if: always()
    needs:
      [
        rust,
        rust-shipping,
        desktop,
        windows,
        swift,
        kotlin,
        ts,
        e2e-android,
        e2e-ios,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: fail if any lane that ran did not pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if grep -qE '"result": *"(failure|cancelled)"' <<<"$RESULTS"; then
            echo "a lane failed" >&2
            exit 1
          fi
