name: sccache
description: Compiler cache kept on disk and restored as a single cache entry per lane.

inputs:
  key:
    description: Lane identifier, distinct per runner and target.
    required: true
  size:
    description: Upper bound on the on-disk cache before sccache evicts its own entries.
    required: false
    default: 2G

runs:
  using: composite

  steps:
    - uses: mozilla-actions/sccache-action@v0.0.11

    - shell: bash
      run: |
        set -euo pipefail
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_DIR=${RUNNER_TEMP}/sccache"
          echo "SCCACHE_CACHE_SIZE=${{ inputs.size }}"
        } >>"$GITHUB_ENV"

    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-${{ inputs.key }}-${{ github.sha }}
        restore-keys: sccache-${{ inputs.key }}-
